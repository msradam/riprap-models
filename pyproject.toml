[project]
name = "riprap-models"
version = "0.1.0"
description = "Reproduction harness for three NYC fine-tuned foundation models (TerraMind, Prithvi-EO 2.0, Granite TTM r2)."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Adam Rahman", email = "msrahmanadam@gmail.com" }]
requires-python = ">=3.12,<3.13"

# The base install pulls in CLI + metrics + energy plumbing. Model-specific
# heavy dependencies (terratorch, granite-tsfm, terramind) live in extras so
# CI smoke tests stay fast and a reviewer can pick what they want to install.
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "numpy>=1.26",
    "psutil>=5.9",
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.optional-dependencies]
torch = [
    "torch>=2.4",
]
terramind = [
    "torch>=2.4",
    "terratorch>=0.10",
    "rasterio>=1.3",
    "pillow>=10.0",
    "matplotlib>=3.8",
]
prithvi = [
    "torch>=2.4",
    "terratorch>=0.10",
    "rasterio>=1.3",
    "pillow>=10.0",
    "matplotlib>=3.8",
]
ttm = [
    "torch>=2.4",
    "granite-tsfm>=0.3",
    "transformers>=4.55,<5",
    "huggingface-hub>=0.34,<1",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
live = [
    "pystac-client>=0.7",
    "planetary-computer>=1.0",
    "rasterio>=1.3",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
riprap-models = "riprap_models.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riprap_models"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
