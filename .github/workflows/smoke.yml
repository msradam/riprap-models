name: smoke

on:
  push:
    branches: [main, eod-build]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install (base + dev only)
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Ruff
        run: uv run ruff check src tests

      - name: Pytest (smoke + metrics + device + energy)
        run: uv run pytest tests -q

      - name: CLI imports
        run: uv run riprap-models --help
